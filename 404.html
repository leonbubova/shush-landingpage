<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🤫</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #121215; color: #dcdcde;
      font-family: "Inter", -apple-system, sans-serif;
    }
    h1 {
      font-family: "Newsreader", Georgia, serif; font-weight: 400;
      font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 1rem;
    }
    h1 em { font-style: italic; color: #c4b5fd; }
    p {
      color: rgba(220,220,222,0.5); font-size: 0.9rem; font-weight: 300;
      margin-bottom: 2rem;
    }
    a {
      color: #c4b5fd; text-decoration: none; font-size: 0.85rem;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.7; }
  </style>
</head>
<body>
  <h1>hier ist es so <em>ruhig</em></h1>
  <p>…dass nicht mal die seite existiert. 🤫</p>
  <a href="/">zurück zur stille →</a>
</body>
</html>
